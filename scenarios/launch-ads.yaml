schemaVersion: 1
id: launch-ads
version: 0.1.0
name: Launch Ads (Phase 2)
description: >
  Phase 2 ads kickoff once the site is live. Single-step scenario;
  the underlying skill is human-led (GUI dashboard work) and
  classified dangerous because it spends client money.

inputs:
  - name: clientPath
    kind: path
    required: true
    description: Absolute path to the client folder created by `init`.

steps:
  - module: df-client-launchpad
    skill: ads
    description: Configure and launch Google Ads / Meta Ads campaigns.
    inputs:
      clientPath: $input.clientPath
