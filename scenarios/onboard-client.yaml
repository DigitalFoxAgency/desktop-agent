schemaVersion: 1
id: onboard-client
version: 0.1.0
name: Onboard Client (Phase 1)
description: >
  Full Digital Fox client onboarding pipeline from intake through live
  Cloudflare Pages deployment. Mirrors df-client-launchpad ORDER.md
  Phase 1 in order. The optional `keywords` skill is exposed as a
  direct skill, not part of this scenario, matching ORDER.md.

inputs:
  - name: niche
    kind: string
    required: true
    description: Client niche / vertical.
  - name: city
    kind: string
    required: true
    description: Client city.
  - name: clientName
    kind: string
    required: true
    description: Client display name.

steps:
  - module: df-client-launchpad
    skill: init
    description: Bootstrap the client workspace, repo, and config.
    inputs:
      niche: $input.niche
      city: $input.city
      clientName: $input.clientName

  - module: df-client-launchpad
    skill: pre-research
    description: Auto-collect market and site data.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: brief
    description: Discovery call (human-led) — produce briefs and seed config.ts.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: research
    description: Perplexity Deep Research run.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: semantics
    description: Keywords, ad copy, budget forecast.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: strategy
    description: Positioning, ICP, SWOT, funnel.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: strategy-pdf
    description: Render strategy PDF.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: offer
    description: Draft the offer (human approval required).
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: architecture
    description: Page map (H1 / meta / CTA).
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: design
    description: Design system: tokens, base components.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: site
    description: Build the Astro site under 07-site/.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: integrations
    description: Resend, Telegram, SendPulse, GTM, GA4, Pixel, Consent Mode, Drive.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: seo
    description: SEO audit.
    inputs:
      clientPath: $step[0].outputs.clientPath

  - module: df-client-launchpad
    skill: deploy
    description: Deploy to Cloudflare Pages.
    inputs:
      clientPath: $step[0].outputs.clientPath
