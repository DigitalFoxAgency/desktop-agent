version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-deps:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "FluentAssertions"
          - "NSubstitute"
          - "coverlet.*"
          - "Verify.*"
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
